project: 
  type: default
  render:
  
    # fetch data from redivis using levantemodels functions
    # (saving participants, runs, trials_prelim, trial_data)
    - 01_fetch_data/01_fetch_task_data.qmd
  
    # do further analysis-specific data processing
    # (saving runs_filtered_trials, run_exclusions, task_data_nested)
    - 01_fetch_data/02_scoring_prep.qmd

    # fit suite of IRT models
    # (saving model record objects to model registry)
    - 02_score_data/01_fit_irt/01_fit_irt_modular.qmd

    # extract fit stats, scores, and item params from model records in registry
    # (saving mod_stats, mod_scores, all_coefs)
    - 02_score_data/02_extract_irt/02_compare_models.qmd
    - 02_score_data/02_extract_irt/03_extract_model_scores.qmd
    - 02_score_data/02_extract_irt/04_extract_model_coefs.qmd
    
    # compute non-IRT scores (sumscores, CAT thetas, tasks with custom scoring)
    # (saving various to scores/)
    - 02_score_data/score_general.qmd
  
    # combine various score types into df with one score per run
    # (save to scores/scores_combined)
    - 02_score_data/combine_scores.qmd
